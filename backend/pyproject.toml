# Build and dependency definition for the insidegame backend package.
# It pins the Microsoft Agent Framework packages used by the agent layer and declares test tooling.
# Pytest is configured here so tests run against the src layout without installation.

[project]
name = "insidegame"
version = "0.2.0"
description = "Explainable football match intelligence from synthetic event data"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.14.4",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
    "azure-identity>=1.19",
    "azure-monitor-opentelemetry>=1.6",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
foundry = ["azure-ai-projects>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insidegame"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
